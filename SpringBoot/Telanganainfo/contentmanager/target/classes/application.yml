spring:
 profiles:
   active: local

---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: Telanganainfo    
  datasource:
    driverClassName: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/telanganainfo
    username: developer
    password: Database#1 #root@admin
  jpa:
    hibernate.ddl-auto: update
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
management:
  endpoints:
    web: 
     exposure:
       include: "*"
       exclude: "env,beans"

logging:
  level:
    ROOT: WARN

welcome:
  message: ${WEL_MESSAGE:Telanganainfo ContentManager Service started}

---
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: Telanganainfo    
  datasource:
    driverClassName: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/telanganainfo
    username: developer 
    password: Database#1
  jpa:
    hibernate.ddl-auto: update
    generate-ddl: true
    show-sql: true
 