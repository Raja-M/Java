spring:

  datasource:
    url: jdbc:h2:mem:tgnewsdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

variable:
  welcome-message: ${WELCOME_MESSAGE:Welcome to tgnews application}
  environment: ${SPRING_PROFILES_ACTIVE:undefined}